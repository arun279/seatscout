# Advisories with no fixed release yet, in packages that run only on a developer's machine or in CI.
# Each expires, so the scan raises it again when a fix may have shipped.

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2026-12-01T00:00:00Z
reason = "zod 3 comes only through @expo/cli on the developer's machine, whose latest release still requires zod 3, and the fix shipped only in zod 4; it validates only the dev-tools plugin descriptions of the local dev server, and the app bundle does not include it."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-12-01T00:00:00Z
reason = "deepmerge has no fixed release. It merges this repository's own Expo config at build time and Jest's config in tests; the exported app bundle does not contain it."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-01T00:00:00Z
reason = "glob 13 comes only through Expo's build tools, which read this repository's own files; the fix is the next major, outside their range, and the exported app bundle does not contain it."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-01T00:00:00Z
reason = "minimatch runs only in Expo's, Jest's and Stryker's build and test tools, on patterns this repository writes; the fix is a major version outside their ranges, and the exported app bundle does not contain it."

[[PackageOverrides]]
name = "@cspell/dict-django"
ecosystem = "npm"
license.ignore = true
reason = "A word list the spell checker reads on developer machines and in CI; the app never bundles it. Version 4.1.7 is published under WTFPL, which the FSF lists as a free licence compatible with the GPL."
