pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{cjs,css,cts,js,json,jsonc,jsx,md,mjs,mts,ts,tsx,yaml,yml}"
      run: pnpm exec biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{cjs,css,cts,html,js,json,jsonc,jsx,mjs,mts,ts,tsx,yaml,yml}"
      run: pnpm exec biome lint --no-errors-on-unmatched {staged_files}
    spell:
      run: pnpm exec cspell lint --no-must-find-files {staged_files}
    cache-storage:
      glob: "apps/**"
      run: node tools/no-cache-storage-reach.mjs
    secrets:
      run: gitleaks git --pre-commit --staged --no-banner --redact --verbose
      fail_text: Install gitleaks, or run git commit --no-verify to skip the scan

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    unit:
      run: pnpm test:unit
    dead-code:
      run: pnpm dead-code
    counts:
      run: pnpm counts
    claims:
      run: pnpm claims
