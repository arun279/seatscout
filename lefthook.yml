pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      run: pnpm exec biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{css,js,json,jsonc,jsx,ts,tsx,yaml,yml}"
      run: pnpm exec biome lint --no-errors-on-unmatched {staged_files}
    spell:
      run: pnpm exec cspell lint --no-must-find-files {staged_files}
    instrumented:
      glob: "*.{ts,tsx}"
      run: node tools/no-instrumented-sources.mjs {staged_files}
    secrets:
      run: gitleaks git --pre-commit --staged --no-banner --redact --verbose
      fail_text: Install gitleaks, or run git commit --no-verify to skip the scan

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    unit:
      run: pnpm test:unit
    dead-code:
      run: pnpm dead-code
