pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{cjs,css,cts,js,json,jsonc,jsx,md,mjs,mts,ts,tsx,yaml,yml}"
      run: pnpm exec biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{cjs,css,cts,html,js,json,jsonc,jsx,mjs,mts,ts,tsx,yaml,yml}"
      run: pnpm exec biome lint --no-errors-on-unmatched {staged_files}
    complexity:
      glob: "*.{cjs,cts,js,jsx,mjs,mts,ts,tsx}"
      run: pnpm exec oxlint {staged_files}
    spell:
      run: pnpm exec cspell lint --no-must-find-files {staged_files}
    secrets:
      run: gitleaks git --pre-commit --staged --no-banner --redact --verbose
      fail_text: Install gitleaks, or run git commit --no-verify to skip the scan

pre-push:
  jobs:
    - name: push-checks
      use_stdin: true
      run: |
        refs= sends=
        while read -r local_ref _; do
          refs=y
          [ "$local_ref" = "(delete)" ] || sends=y
        done
        if [ -n "$refs" ] && [ -z "$sends" ]; then exit 0; fi
        exec pnpm exec lefthook run push-checks

push-checks:
  parallel: true
  commands:
    format:
      run: pnpm format:check
    lint:
      run: pnpm lint
    spell:
      run: pnpm spell --cache --cache-strategy content
    typecheck:
      run: pnpm typecheck
    complexity:
      run: pnpm complexity
    duplication:
      run: pnpm duplication
    unit:
      run: pnpm test:unit --changed origin/main --passWithNoTests
      env:
        VITEST_MAX_WORKERS: "3"
    dead-code:
      run: pnpm dead-code --cache
    counts:
      run: pnpm counts
    claims:
      run: pnpm claims
    versions:
      run: pnpm versions
