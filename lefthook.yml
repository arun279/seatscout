pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      run: pnpm exec biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{css,js,json,jsonc,jsx,ts,tsx,yaml,yml}"
      run: pnpm exec biome lint --no-errors-on-unmatched {staged_files}
    spell:
      run: pnpm exec cspell lint --no-must-find-files {staged_files}
    secrets:
      run: gitleaks git --pre-commit --staged --no-banner --redact

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    unit:
      run: pnpm test:unit
    dead-code:
      run: pnpm dead-code
