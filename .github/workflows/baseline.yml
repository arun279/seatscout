name: Baseline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      accept:
        description: To keep this run's reading as the reference even if it reads worse, say why. The reason is recorded with the reading and on the device-red issue.
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      SEATSCOUT_UPSTREAM: corpus
      APP_ID: io.github.arun279.seatscout
      LINK: seatscout:///?area=75006&date=2026-09-20&partySize=2
      OUT: reports/device
      APK: apps/native/android/app/build/outputs/apk/release/app-release.apk
      WALK: apps/native/e2e/journey.yaml
    steps:
      - name: Read the reason a reading is accepted, and refuse it anywhere but main's newest commit
        id: accept
        env:
          ACCEPT: ${{ inputs.accept }}
        run: |
          reason="$(tr -s '[:space:]' ' ' <<< "$ACCEPT" | sed -e 's/^ //' -e 's/ $//')"
          if [ -n "$reason" ]; then
            newest="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
            if [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_SHA" != "$newest" ]; then
              echo "::error::Only a run on main's newest commit, $newest, can set the reference the next Baseline run is held to. This run is on $GITHUB_REF at $GITHUB_SHA."
              exit 1
            fi
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Write the Android project the app's configuration describes
        run: pnpm --filter @seatscout/native exec expo prebuild --platform android --no-install
      - name: Set up Gradle, writing its caches from main for every pull request to read
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Build main's release app for the emulator's processor, with the Source answered from the corpus
        working-directory: apps/native/android
        env:
          NDK_VERSION: 27.3.13750724
          CMAKE_VERSION: 3.31.5
        run: |
          find "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" -mindepth 1 -maxdepth 1 | sort > "$RUNNER_TEMP/shipped"
          ./gradlew assembleRelease --init-script ../../../.github/gradle/preinstalled-android-tools.gradle -PreactNativeArchitectures=x86_64 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          if ! find "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" -mindepth 1 -maxdepth 1 | sort | diff "$RUNNER_TEMP/shipped" -; then
            echo "::error::Gradle downloaded an NDK or a CMake, so a build can fail on a corrupt download. Every Android project should build with NDK $NDK_VERSION and CMake $CMAKE_VERSION, which the runner image ships."
            exit 1
          fi
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Install Flashlight
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flashlight.zip" https://github.com/bamlab/flashlight/releases/download/v0.18.0/flashlight-linux.zip
          echo "5b9faba6254344d78ee5d0326c293807fcbc43918eb53c272f3c1e054557ea68  $RUNNER_TEMP/flashlight.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/flashlight.zip" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/flashlight-linux" /usr/local/bin/flashlight
      - name: Let the emulator use the runner's hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$OUT"
      - name: Collect the reading the previous Baseline run on main left, the way a shard inherits its seed
        id: previous
        run: |
          id="$(gh api "repos/$GH_REPO/actions/artifacts?name=device-reading&per_page=30" \
            --jq '[.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not))][0].id // empty')"
          if [ -z "$id" ]; then
            echo "No earlier Baseline run on main left a reading, so this one is held to nothing."
            exit 0
          fi
          gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/previous.zip"
          unzip -o "$RUNNER_TEMP/previous.zip" journey.json -d "$RUNNER_TEMP/previous"
          echo "path=$RUNNER_TEMP/previous/journey.json" >> "$GITHUB_OUTPUT"
          echo "Holding this reading to artifact $id."
      - name: Walk the journey on an emulator, then measure it with Flashlight
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            apps/native/e2e/device.sh
            apps/native/e2e/measure.sh
      - name: Hold the reading to the previous run's, one steady measure at a time
        id: held
        env:
          PREVIOUS: ${{ steps.previous.outputs.path }}
          REASON: ${{ steps.accept.outputs.reason }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          held=(--no-previous)
          [ -z "$PREVIOUS" ] || held=(--previous "$PREVIOUS")
          verdict=0
          node tools/device/src/index.ts --journey "$OUT/journey.json" "${held[@]}" > "$OUT/device.md" || verdict=$?
          if [ ! -s "$OUT/device.md" ]; then
            echo "::error::The judge read no reading it could hold, so there is nothing to keep for the next run. Its own refusal is above."
            exit 1
          fi
          if [ -n "$REASON" ]; then
            printf 'Kept as the reference the next run is held to, whatever it read: @%s accepted it on %s because %s. %s\n' \
              "$ACTOR" "$(date -u +%Y-%m-%d)" "$REASON" "$RUN" >> "$OUT/device.md"
          fi
          tee -a "$GITHUB_STEP_SUMMARY" < "$OUT/device.md"
          if [ "$verdict" = 0 ]; then
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$verdict" = 0 ] || [ -n "$REASON" ]; then
            echo "keep=true" >> "$GITHUB_OUTPUT"
          else
            echo "keep=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep a reading that held, or one accepted by hand, for the next run to be held to
        if: steps.held.outputs.keep == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-reading
          path: |
            ${{ env.OUT }}/journey.json
            ${{ env.OUT }}/device.md
          if-no-files-found: error
          retention-days: 14
      - name: Say that a steady measure got worse, where the maintainer will see it
        if: steps.held.outputs.regressed == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          {
            echo "The Baseline run on main read the app on the emulator worse than the previous run's worst iteration on a steady measure. The report names each measure, this commit's median and the previous run's worst."
            echo
            cat "$OUT/device.md"
            echo
            echo "$RUN"
          } > device-red.md
          gh label create device-red --color B60205 --force \
            --description "A Baseline run on main read the app on the emulator worse than the run before"
          open=$(gh issue list --label device-red --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file device-red.md
          else
            gh issue create --label device-red --body-file device-red.md \
              --title "The app read worse on the emulator than the run before"
          fi
      - name: Close what a reading that held answers, and record one accepted by hand on an issue, which outlives the artifact
        if: steps.held.outputs.keep == 'true'
        env:
          REASON: ${{ steps.accept.outputs.reason }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ -n "$REASON" ]; then
            body="@$ACTOR accepted this Baseline run's reading as the new reference because $REASON. $RUN"
          else
            body="A later Baseline run read no steady measure worse than the run before it. $RUN"
          fi
          open=$(gh issue list --label device-red --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
            gh issue close "$open" --reason completed
          elif [ -n "$REASON" ]; then
            gh label create device-red --color B60205 --force \
              --description "A Baseline run on main read the app on the emulator worse than the run before"
            filed="$(gh issue create --label device-red --body "$body" \
              --title "A Baseline reading was accepted as the reference")"
            gh issue close "${filed##*/}" --reason completed
          fi
