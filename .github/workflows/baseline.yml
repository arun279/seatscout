name: Baseline

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name the workspaces the mutation gate is divided into
        id: list
        run: echo "ids=$(jq -c '[.[].id]' stryker.shards.json)" >> "$GITHUB_OUTPUT"

  mutation:
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.ids) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Name main's tree, which the branch that merged already judged, and the file this shard's seed lives in
        id: tree
        run: |
          {
            echo "main=$(git rev-parse 'HEAD^{tree}')"
            echo "seed=$(MUTATION_SHARD="$SHARD" node --input-type=module --eval 'const { default: config } = await import("./stryker.config.mjs"); console.log(config.incrementalFile)')"
          } >> "$GITHUB_OUTPUT"
      - name: On a push, inherit this shard's report from the artifact its own run published; the schedule starts from nothing
        if: github.event_name == 'push'
        env:
          NAMED: stryker-shard-${{ matrix.shard }}-tree-${{ steps.tree.outputs.main }}
        run: |
          id="$(gh api "repos/$GH_REPO/actions/artifacts?name=$NAMED&per_page=1" --jq '.artifacts[0].id // empty')"
          if [ -n "$id" ]; then
            mkdir -p reports
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/seed.zip"
            unzip -o "$RUNNER_TEMP/seed.zip" -d reports
            echo "Inherited $NAMED from artifact $id."
          else
            echo "No branch published $NAMED; judging this workspace from nothing."
          fi
      - name: Judge this workspace on main
        id: judge
        run: |
          set -o pipefail
          pnpm test:mutation:shard "$SHARD" 2>&1 | tee "$RUNNER_TEMP/stryker.log"
      - name: Hold this shard to the tests its own workspace holds
        if: ${{ !cancelled() }}
        uses: ./.github/actions/hold-shard
        with:
          shard: ${{ matrix.shard }}
          judged: ${{ steps.judge.outcome }}
          log: ${{ runner.temp }}/stryker.log
      - name: Leave what it judged for every branch to start from
        if: success()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tree.outputs.seed }}
          key: stryker-shard-${{ matrix.shard }}-main-${{ github.sha }}
      - name: Leave it under the tree's name, which the next branch restores by
        if: success()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tree.outputs.seed }}
          key: stryker-shard-${{ matrix.shard }}-tree-${{ steps.tree.outputs.main }}

  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      SEATSCOUT_UPSTREAM: corpus
      APP_ID: io.github.arun279.seatscout
      LINK: seatscout:///?area=75006&date=2026-08-28&partySize=2
      OUT: reports/device
      APK: apps/native/android/app/build/outputs/apk/release/app-release.apk
      WALK: apps/native/e2e/journey.yaml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Write the Android project the app's configuration describes
        run: pnpm --filter @seatscout/native exec expo prebuild --platform android --no-install
      - name: Set up Gradle, writing its caches from main for every pull request to read
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Build main's release app for the emulator's processor, with the Source answered from the corpus
        working-directory: apps/native/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Install Flashlight
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flashlight.zip" https://github.com/bamlab/flashlight/releases/download/v0.18.0/flashlight-linux.zip
          echo "5b9faba6254344d78ee5d0326c293807fcbc43918eb53c272f3c1e054557ea68  $RUNNER_TEMP/flashlight.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/flashlight.zip" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/flashlight-linux" /usr/local/bin/flashlight
      - name: Let the emulator use the runner's hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$OUT"
      - name: Collect the reading the previous Baseline run on main left, the way a shard inherits its seed
        id: previous
        run: |
          id="$(gh api "repos/$GH_REPO/actions/artifacts?name=device-reading&per_page=30" \
            --jq '[.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not))][0].id // empty')"
          if [ -z "$id" ]; then
            echo "No earlier Baseline run on main left a reading, so this one is held to nothing."
            exit 0
          fi
          gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/previous.zip"
          unzip -o "$RUNNER_TEMP/previous.zip" journey.json -d "$RUNNER_TEMP/previous"
          echo "path=$RUNNER_TEMP/previous/journey.json" >> "$GITHUB_OUTPUT"
          echo "Holding this reading to artifact $id."
      - name: Walk the journey on an emulator, then measure it with Flashlight
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            apps/native/e2e/device.sh
            apps/native/e2e/measure.sh
      - name: Hold the reading to the previous run's, one steady measure at a time
        id: held
        env:
          PREVIOUS: ${{ steps.previous.outputs.path }}
        run: |
          held=(--no-previous)
          [ -z "$PREVIOUS" ] || held=(--previous "$PREVIOUS")
          verdict=0
          node tools/device/src/index.ts --journey "$OUT/journey.json" "${held[@]}" > "$OUT/device.md" || verdict=$?
          tee -a "$GITHUB_STEP_SUMMARY" < "$OUT/device.md"
          if [ ! -s "$OUT/device.md" ]; then
            echo "::error::The judge read no reading it could hold, so there is nothing to keep for the next run. Its own refusal is above."
            exit 1
          fi
          echo "regressed=$([ "$verdict" = 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: Keep the reading and its report for the next run to be held to
        if: steps.held.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-reading
          path: |
            ${{ env.OUT }}/journey.json
            ${{ env.OUT }}/device.md
          if-no-files-found: error
          retention-days: 14
      - name: Say that a steady measure got worse, where the maintainer will see it
        if: steps.held.outputs.regressed == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          {
            echo "The Baseline run on main read the app on the emulator worse than the previous run's worst iteration on a steady measure. The report names each measure, this commit's median and the previous run's worst."
            echo
            cat "$OUT/device.md"
            echo
            echo "$RUN"
          } > device-red.md
          gh label create device-red --color B60205 --force \
            --description "A Baseline run on main read the app on the emulator worse than the run before"
          open=$(gh issue list --label device-red --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file device-red.md
          else
            gh issue create --label device-red --body-file device-red.md \
              --title "The app read worse on the emulator than the run before"
          fi
      - name: Close what a reading that held answers
        if: steps.held.outputs.regressed == 'false'
        run: |
          open=$(gh issue list --label device-red --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body \
              "A later Baseline run read no steady measure worse than the run before it. $RUN"
            gh issue close "$open" --reason completed
          fi

  alarm:
    needs: mutation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      JUDGED: ${{ needs.mutation.result }}
    steps:
      - name: Say that main's baseline is red, where the maintainer will see it
        if: ${{ needs.mutation.result != 'success' && github.event_name != 'workflow_dispatch' }}
        run: |
          shards=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' | paste -sd , - | sed 's/,/, /g')
          {
            echo "The Baseline run on main came back $JUDGED, so main's tree was not judged in full and the shards that failed saved no seed for the next branch to start from."
            echo
            echo "The shards that failed: ${shards:-none the run names}. Each one's summary names the tests its initial run reported failing."
            echo
            echo "$RUN"
          } > baseline.md
          cat baseline.md >> "$GITHUB_STEP_SUMMARY"
          gh label create baseline-red --color B60205 --force \
            --description "A Baseline run on main is red, and its comments say how"
          open=$(gh issue list --label baseline-red --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file baseline.md
          else
            gh issue create --label baseline-red --body-file baseline.md \
              --title "The Baseline run on main failed"
          fi
      - name: Close what a green baseline answers
        if: ${{ needs.mutation.result == 'success' }}
        run: |
          open=$(gh issue list --label baseline-red --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body \
              "A later Baseline judged every workspace of main's tree and passed. $RUN"
            gh issue close "$open" --reason completed
          fi
      - name: Refuse the run if a shard refused main's tree
        if: ${{ needs.mutation.result != 'success' }}
        run: |
          echo "::error::The mutation shards came back $JUDGED. The issue labelled baseline-red says which ones."
          exit 1
