name: Baseline

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Name main's tree, which the branch that merged already judged
        id: tree
        run: echo "main=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: On a push, inherit the merged branch's report; the schedule starts from nothing
        if: github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-tree-${{ steps.tree.outputs.main }}
          restore-keys: |
            stryker-
      - name: Judge main
        run: |
          set -o pipefail
          pnpm test:mutation:incremental 2>&1 | tee "$RUNNER_TEMP/stryker-mutation.log"
      - name: Check that mutation saw every test file
        id: mutation_test_collection
        run: |
          set -o pipefail
          ran_tests="$(sed -n 's/.*Initial test run succeeded\. Ran \([0-9][0-9]*\) tests.*/\1/p' "$RUNNER_TEMP/stryker-mutation.log" | tail -n 1)"
          expected_tests="$(
            find apps packages tools -path "*/src/*" \( -name "*.ts" -o -name "*.tsx" \) ! -path "apps/native/src/*" ! -name "*.test.*" ! -name "*.spec.*" ! -name "*.fixtures.*" -print0 |
              xargs -0 pnpm exec vitest related --config vitest.config.ts --run --reporter=json |
              jq '.numTotalTests'
          )"
          echo "Stryker initial tests: ${ran_tests:-missing}"
          echo "Expected Stryker-related unit tests: $expected_tests"
          if [ -n "$ran_tests" ] && [ "$ran_tests" -eq "$expected_tests" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::error::Stryker ran ${ran_tests:-no} tests, but the Stryker-related unit test count is $expected_tests."
            {
              echo "### Incomplete mutation test collection"
              echo
              echo "Stryker ran ${ran_tests:-no} tests, but the Stryker-related unit test count is $expected_tests. The incremental mutation report was not saved."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Leave what it judged for every branch to start from
        if: steps.mutation_test_collection.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-main-${{ github.sha }}
      - name: Leave it under the tree's name, which the next branch restores by
        if: steps.mutation_test_collection.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-tree-${{ steps.tree.outputs.main }}
