name: Baseline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Judge main with no incremental file to inherit from
        run: pnpm test:mutation:incremental
      - name: Check that mutation saw every test file
        id: mutation_test_collection
        run: |
          report_files="$(jq '.testFiles | length' reports/stryker-incremental.json)"
          listed_files="$(pnpm exec vitest list --filesOnly | sed 's/^\[[^]]*\] //' | sort -u | wc -l | tr -d ' ')"
          echo "Stryker report test files: $report_files"
          echo "Listed test files: $listed_files"
          if [ "$report_files" = "$listed_files" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::error::Stryker collected $report_files test files, but the test runner listed $listed_files."
            {
              echo "### Incomplete mutation test collection"
              echo
              echo "Stryker collected $report_files test files, but the test runner listed $listed_files. The incremental mutation report was not saved."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Leave what it judged for every branch to start from
        if: steps.mutation_test_collection.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-main-${{ github.sha }}
