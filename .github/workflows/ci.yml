name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - name: Install actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
      - name: Install shellcheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm complexity
      - run: pnpm duplication
      - run: actionlint
      - run: shellcheck deploy/*.sh
      - run: pnpm spell
      - run: pnpm typecheck
      - run: pnpm dead-code
      - run: pnpm versions
      - run: pnpm --filter @seatscout/native run install-check
      - run: pnpm --filter @seatscout/native run doctor
      - name: Check the app bundles for both phones on a machine that has only what the lockfile installs
        run: pnpm --filter @seatscout/native run bundle
      - run: pnpm counts
      - run: pnpm claims
      - run: pnpm test:unit
      - run: pnpm test:native
      - run: pnpm build
      - name: Check the deployment builds from the repository alone
        working-directory: apps/proxy
        run: pnpm exec wrangler deploy --dry-run
      - name: Install the browser the end-to-end suite drives
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Measure the journey on this branch
        run: pnpm test:journey
      - name: Measure the journey at the merge base
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          if listed="$(pnpm exec playwright test --list --grep @performance 2>&1)"; then
            pnpm exec playwright install --with-deps chromium
            pnpm build
            pnpm exec playwright test --grep @performance
            cp reports/journey/samples.json "$GITHUB_WORKSPACE/reports/journey/base.json"
            if [ -f reports/journey/gesture.json ]; then
              cp reports/journey/gesture.json "$GITHUB_WORKSPACE/reports/journey/base-gesture.json"
            fi
          elif printf '%s' "$listed" | grep -q "No tests found"; then
            echo "The merge base has no journey to hold this one to."
          else
            printf '%s\n' "$listed"
            exit 1
          fi
      - name: Hold the journey to the merge base
        run: |
          held=(--no-baseline)
          if [ -f reports/journey/base.json ]; then
            held=(--base reports/journey/base.json)
            if [ -f reports/journey/base-gesture.json ]; then
              held+=(--base-gesture reports/journey/base-gesture.json)
            fi
          fi
          pnpm journey --head reports/journey/samples.json \
            --head-gesture reports/journey/gesture.json "${held[@]}"

  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name the workspaces the mutation gate is divided into
        id: list
        run: echo "ids=$(jq -c '[.[].id]' stryker.shards.json)" >> "$GITHUB_OUTPUT"

  mutation:
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.ids) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Name this tree and main's, since a merged branch's tree is main's next tree, and the file this shard's seed lives in
        id: trees
        run: |
          git fetch --no-tags --depth=1 origin main
          {
            echo "head=$(git rev-parse 'HEAD^{tree}')"
            echo "base=$(git rev-parse 'origin/main^{tree}')"
            echo "seed=$(MUTATION_SHARD="$SHARD" node --input-type=module --eval 'const { default: config } = await import("./stryker.config.mjs"); console.log(config.incrementalFile)')"
          } >> "$GITHUB_OUTPUT"
      - name: Restore what an earlier run already judged of this workspace
        id: seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.trees.outputs.seed }}
          key: stryker-shard-${{ matrix.shard }}-tree-${{ steps.trees.outputs.head }}
          restore-keys: |
            stryker-shard-${{ matrix.shard }}-tree-${{ steps.trees.outputs.base }}
            stryker-shard-${{ matrix.shard }}-branch-${{ github.head_ref }}-
            stryker-shard-${{ matrix.shard }}-main-
            stryker-main-
            stryker-native-main-
      - name: Refuse to judge the whole workspace from nothing
        if: steps.seed.outputs.cache-matched-key == ''
        run: |
          echo "::error::No mutation seed could be restored for the $SHARD shard, and a pull request never judges a workspace from nothing. A cache's version comes from its path list, so a changed path list hides every seed saved before it; an evicted cache does the same. Dispatch the Baseline workflow on main to reseed, then re-run this."
          exit 1
      - name: Judge this workspace by mutating it and running its own tests
        id: mutation
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:mutation:shard "$SHARD" 2>&1 | tee "$RUNNER_TEMP/stryker.log"
      - name: Hold this shard to the tests its own workspace holds
        id: collection
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/hold-shard
        with:
          shard: ${{ matrix.shard }}
          judged: ${{ steps.mutation.outcome }}
          log: ${{ runner.temp }}/stryker.log
      - name: Leave what this shard judged for the next push to start from
        if: always() && steps.mutation.outcome == 'success' && steps.collection.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.trees.outputs.seed }}
          key: stryker-shard-${{ matrix.shard }}-branch-${{ github.head_ref }}-${{ github.sha }}
      - name: Leave it under this tree's name too, for main once this branch merges
        if: always() && steps.mutation.outcome == 'success' && steps.collection.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.trees.outputs.seed }}
          key: stryker-shard-${{ matrix.shard }}-tree-${{ steps.trees.outputs.head }}
      - name: Publish it for main to inherit, since a cache saved on a branch is invisible to main
        if: always() && steps.mutation.outcome == 'success' && steps.collection.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-shard-${{ matrix.shard }}-tree-${{ steps.trees.outputs.head }}
          path: ${{ steps.trees.outputs.seed }}
          retention-days: 14
      - name: Hand this shard's score to the job that reports every shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: ignore
      - name: Refuse this shard if it fell below its threshold or judged less than its workspace holds
        if: ${{ !cancelled() && (steps.mutation.outcome != 'success' || steps.collection.outcome != 'success') }}
        env:
          JUDGED: ${{ steps.mutation.outcome }}
          COLLECTED: ${{ steps.collection.outcome }}
        run: |
          echo "::error::The $SHARD shard's mutation run came back $JUDGED and its test collection $COLLECTED. The steps above say why."
          exit 1

  footprint:
    needs: mutation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      JUDGED: ${{ needs.mutation.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Collect what every shard judged
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: mutation-*
          merge-multiple: true
          path: reports/mutation
      - name: Hold every shard to a report that weighed something
        id: reports
        continue-on-error: true
        run: |
          refused=0
          for report in $(jq -r '.[].report' stryker.shards.json); do
            node tools/no-empty-run/src/index.ts mutation "$report" || refused=1
          done
          exit "$refused"
      - name: Check that the shards between them saw every test file
        id: collection
        continue-on-error: true
        run: |
          set -o pipefail
          uncounted=""
          for id in $(jq -r '.[].id' stryker.shards.json); do
            [ -s "reports/mutation/$id.counted.json" ] || uncounted="$uncounted $id"
          done
          if [ -n "$uncounted" ]; then
            echo "::error::These shards published no count of the tests they ran:$uncounted. The sum over the shards can be held to nothing, and a shard that did not report is a red verdict rather than a smaller number."
            exit 1
          fi
          pnpm exec vitest list --json="$RUNNER_TEMP/unit.json"
          pnpm exec jest --config apps/native/jest.config.js --ci --json --maxWorkers 2 \
            --outputFile="$RUNNER_TEMP/screens.json" > /dev/null
          if [ ! -s "$RUNNER_TEMP/unit.json" ] || [ ! -s "$RUNNER_TEMP/screens.json" ]; then
            echo "::error::A runner wrote no listing of its tests, so there is nothing to hold the sum over the shards to. Its own errors are above."
            exit 1
          fi
          held=$(( $(jq 'length' "$RUNNER_TEMP/unit.json") + $(jq '.numTotalTests' "$RUNNER_TEMP/screens.json") ))
          counted="$(jq -s '[.[].ran] | add // 0' reports/mutation/*.counted.json)"
          {
            echo "counted=$counted"
            echo "held=$held"
          } >> "$GITHUB_OUTPUT"
          echo "The shards judged $counted tests of the $held the runners collect."
          if [ "$counted" -eq "$held" ]; then
            exit 0
          fi
          echo "::error::The shards judged $counted tests between them and the runners collect $held. A test file under no shard's workspace falls between them and is judged by nothing, so stryker.shards.json is short of a workspace."
          exit 1
      - name: Install the counter
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloc" https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl
          echo "bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  $RUNNER_TEMP/cloc" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/cloc" /usr/local/bin/cloc
      - name: Measure the footprint
        id: footprint
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm footprint --base "$BASE" --head "$HEAD" --out footprint.md
      - name: Say what every gate did, so a red run reports as fully as a green one
        if: ${{ !cancelled() }}
        env:
          REPORTED: ${{ steps.reports.outcome }}
          COLLECTION: ${{ steps.collection.outcome }}
          MEASURED: ${{ steps.footprint.outcome }}
          COUNTED: ${{ steps.collection.outputs.counted }}
          HELD: ${{ steps.collection.outputs.held }}
        run: |
          {
            echo "## What the gates did"
            echo
            echo "| gate | verdict |"
            echo "| --- | --- |"
            echo "| Mutation runs, one per workspace | $JUDGED |"
            echo "| Every shard left a report | $REPORTED |"
            echo "| Test collection | $COLLECTION, the shards held ${COUNTED:-an uncounted number of} tests between them, and the runners collect ${HELD:-an uncounted number} |"
            echo "| Footprint measurement | $MEASURED |"
            echo
          } > verdict.md
          if [ -s footprint.md ]; then
            cat footprint.md >> verdict.md
          else
            echo "The footprint was not measured on this run, so there are no figures below." >> verdict.md
          fi
          mv verdict.md footprint.md
      - name: Add the report to the run summary
        if: ${{ !cancelled() }}
        run: cat footprint.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the report on the pull request
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: footprint
          path: footprint.md
      - name: Refuse the change if a gate refused it, now that the report is posted
        if: ${{ !cancelled() }}
        env:
          REPORTED: ${{ steps.reports.outcome }}
          COLLECTION: ${{ steps.collection.outcome }}
          MEASURED: ${{ steps.footprint.outcome }}
        run: |
          if [ "$JUDGED" = success ] && [ "$REPORTED" = success ] && [ "$COLLECTION" = success ] && [ "$MEASURED" = success ]; then
            exit 0
          fi
          echo "::error::Mutation runs $JUDGED, every shard reported $REPORTED, test collection $COLLECTION, footprint measurement $MEASURED. The report on the pull request says what each one measured."
          exit 1

  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      TEST_RUNNER_ARGS: --config jest.perf.config.js --ci --maxWorkers 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - name: Read how steady this runner is before it judges anything
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          { pnpm reassure --baseline && pnpm reassure; } | tee "$RUNNER_TEMP/stability.md"
          rm -rf apps/native/.reassure
      - name: Measure the screens at the merge base
        run: |
          git switch --detach "$BASE"
          pnpm install --frozen-lockfile
          if [ -f apps/native/jest.perf.config.js ]; then
            pnpm reassure --baseline
          else
            echo "The merge base has no screen to measure."
            touch "$RUNNER_TEMP/no-base-measurement"
          fi
          git switch --detach "$HEAD"
          pnpm install --frozen-lockfile
      - name: Measure them on this branch and compare
        run: pnpm reassure
      - name: Say what it measured
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Render performance"
            echo
            echo "### How steady the runner is"
            echo
            echo "Reassure's own reading: below 5 per cent is steady, 10 per cent or more is too"
            echo "high to gate on. The step after it takes that reading and either gates on a"
            echo "significant regression or reports one."
            echo
            echo '```'
            cat "$RUNNER_TEMP/stability.md"
            echo '```'
            echo
            echo "### This branch against its merge base"
            echo
            cat apps/native/.reassure/output.md 2>/dev/null || echo "Nothing was measured."
          } > performance.md
          cat performance.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post it on the pull request
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: performance
          path: performance.md
      - name: Let the reading decide whether a regression fails this
        run: |
          steady="$(grep -oE '[0-9]+(\.[0-9]+)?%' "$RUNNER_TEMP/stability.md" | tr -d '%' | sort -rn | head -n 1)"
          regressed="$(jq '[.significant // [] | .[]] | length' apps/native/.reassure/output.json 2>/dev/null || echo unknown)"
          echo "Widest random change on this runner: ${steady:-none read} per cent. Significant changes: $regressed."
          if [ -z "$steady" ]; then
            echo "::error::The stability run left no reading, so nothing decides whether this gates."
            exit 1
          fi
          if [ "$regressed" = unknown ]; then
            if [ -f "$RUNNER_TEMP/no-base-measurement" ]; then
              echo "::notice::The merge base has no screen to measure, so this job reported only."
              exit 0
            fi
            echo "::error::The comparison left no answer although the merge base could be measured."
            exit 1
          fi
          if awk -v reading="$steady" 'BEGIN { exit !(reading < 5) }'; then
            if [ "$regressed" -gt 0 ]; then
              echo "::error::The runner is steady at $steady per cent, under the 5 per cent Reassure calls steady, and $regressed scenario(s) changed significantly. The comment on the pull request names them."
              exit 1
            fi
            echo "The runner is steady at $steady per cent and nothing changed significantly."
          else
            echo "::warning::The runner read $steady per cent, at or above the 5 per cent Reassure calls steady, so this job reported rather than gated."
          fi

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALLOWED: 0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-4.0,CC-BY-SA-4.0,CC0-1.0,ISC,LGPL-3.0-or-later,MIT,MIT-0,MPL-2.0,Python-2.0,Unlicense
      PLANTED: tools/planted-red/planted/licences/planted-licence.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
      - name: Hold every dependency's licence to the allowlist
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --licenses=${{ env.ALLOWED }}
            --recursive
            ./
      - name: Read the same allowlist over a planted undetermined licence
        id: planted
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=${{ env.PLANTED }}
            --licenses=${{ env.ALLOWED }}
            --recursive
            ./
      - name: Refuse an allowlist that took the planted licence
        if: steps.planted.outcome == 'success'
        run: |
          echo "The allowlist accepted UNKNOWN, so it gates no licence at all." >&2
          exit 1
