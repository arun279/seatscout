name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: apps/native packages package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json .github/workflows/ci.yml
  BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mutation: ${{ steps.plan.outputs.jobs }}
      app: ${{ steps.app.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          install: false
      - name: Split the source files this change touches into mutation jobs
        id: plan
        run: |
          jobs="$(node tools/mutation.mjs --plan "$BASE")"
          echo "$jobs" | jq .
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
      - name: Say whether this change touches the app
        id: app
        run: |
          # shellcheck disable=SC2086
          if git diff --quiet "$BASE...HEAD" -- $APP; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - name: Install actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
      - name: Install shellcheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm complexity
      - run: pnpm duplication
      - run: actionlint
      - run: shellcheck deploy/*.sh apps/native/e2e/*.sh
      - run: pnpm spell
      - run: pnpm typecheck
      - run: pnpm dead-code
      - run: pnpm versions
      - run: pnpm --filter @seatscout/native run install-check
      - run: pnpm --filter @seatscout/native run doctor
      - name: Check the app bundles for both phones and the web on a machine that has only what the lockfile installs
        run: pnpm --filter @seatscout/native run bundle
      - name: Check the same source exports the same scripts twice, so a size ratchet weighs the change and not the build
        working-directory: apps/native
        run: |
          pnpm run weigh
          mv dist "$RUNNER_TEMP/first"
          pnpm run weigh
          diff -r "$RUNNER_TEMP/first/_expo/static/js" dist/_expo/static/js
          rm -rf "$RUNNER_TEMP/first"
      - run: pnpm counts
      - run: pnpm claims
      - run: pnpm test:unit
      - run: pnpm test:native
      - run: pnpm build
      - name: Check the deployment builds from the repository alone
        working-directory: apps/proxy
        run: pnpm exec wrangler deploy --dry-run
      - name: Install the browser the end-to-end suite drives
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Measure the journey on this branch
        run: pnpm test:journey
      - name: Measure the journey at the merge base
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          if listed="$(pnpm exec playwright test --list --grep @performance 2>&1)"; then
            pnpm exec playwright install --with-deps chromium
            pnpm build
            pnpm exec playwright test --grep @performance --workers=1
            cp reports/journey/samples.json "$GITHUB_WORKSPACE/reports/journey/base.json"
            if [ -f reports/journey/gesture.json ]; then
              cp reports/journey/gesture.json "$GITHUB_WORKSPACE/reports/journey/base-gesture.json"
            fi
          elif printf '%s' "$listed" | grep -q "No tests found"; then
            echo "The merge base has no journey to hold this one to."
          else
            printf '%s\n' "$listed"
            exit 1
          fi
      - name: Hold the journey to the merge base
        run: |
          held=(--no-baseline)
          if [ -f reports/journey/base.json ]; then
            held=(--base reports/journey/base.json)
            if [ -f reports/journey/base-gesture.json ]; then
              held+=(--base-gesture reports/journey/base-gesture.json)
            fi
          fi
          pnpm journey --head reports/journey/samples.json \
            --head-gesture reports/journey/gesture.json "${held[@]}"

  mutation:
    name: mutation (${{ matrix.shard }} ${{ strategy.job-index }})
    needs: changes
    if: needs.changes.outputs.mutation != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.mutation) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Mutate the files this change touches and run the tests that reach them
        env:
          SHARD: ${{ matrix.shard }}
          FILES: ${{ matrix.files }}
        run: |
          set -o pipefail
          VITEST_MAX_WORKERS=1 node tools/mutation.mjs --shard "$SHARD" --files "$FILES" 2>&1 | tee "$RUNNER_TEMP/stryker.log"
          expected="$(tr ',' '\n' <<< "$FILES" | wc -l)"
          if ! grep -qE "Found $expected of [0-9]+ file\(s\) to be mutated" "$RUNNER_TEMP/stryker.log"; then
            echo "::error::Stryker was asked to mutate $expected file(s) and did not report finding them all, so this job would pass over less than it was given."
            exit 1
          fi

  android:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SEATSCOUT_UPSTREAM: corpus
      APP_ID: io.github.arun279.seatscout
      LINK: seatscout:///?area=75006&date=2026-08-28&partySize=2
      OUT: reports/device
      APK: apps/native/android/app/build/outputs/apk/release/app-release.apk
      WALK: apps/native/e2e/journey.yaml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Write the Android project the app's configuration describes
        run: pnpm --filter @seatscout/native exec expo prebuild --platform android --no-install
      - name: Read Gradle's caches as main's Baseline run left them
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Build the release app for the emulator's processor, with the Source answered from the corpus
        working-directory: apps/native/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Let the emulator use the runner's hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$OUT"
      - name: Walk the journey on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: apps/native/e2e/device.sh
      - name: Keep what Maestro wrote of the walk
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device
          path: |
            ${{ env.OUT }}/journey.xml
            ${{ env.OUT }}/maestro/
          if-no-files-found: ignore
          include-hidden-files: true

  performance:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      HEAD: ${{ github.event.pull_request.head.sha }}
      TEST_RUNNER_ARGS: --config jest.perf.config.js --ci --maxWorkers 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - name: Read how steady this runner is before it judges anything
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          { pnpm reassure --baseline && pnpm reassure; } | tee "$RUNNER_TEMP/stability.md"
          rm -rf apps/native/.reassure
      - name: Measure the screens at the merge base
        run: |
          git switch --detach "$BASE"
          pnpm install --frozen-lockfile
          if [ -f apps/native/jest.perf.config.js ]; then
            pnpm reassure --baseline
          else
            echo "The merge base has no screen to measure."
            touch "$RUNNER_TEMP/no-base-measurement"
          fi
          git switch --detach "$HEAD"
          pnpm install --frozen-lockfile
      - name: Measure them on this branch and compare
        run: pnpm reassure
      - name: Say what it measured
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Render performance"
            echo
            echo "### How steady the runner is"
            echo
            echo "Reassure's own reading: below 5 per cent is steady, 10 per cent or more is too"
            echo "high to gate on. The step after it takes that reading and either gates on a"
            echo "significant regression or reports one."
            echo
            echo '```'
            cat "$RUNNER_TEMP/stability.md"
            echo '```'
            echo
            echo "### This branch against its merge base"
            echo
            cat apps/native/.reassure/output.md 2>/dev/null || echo "Nothing was measured."
          } > performance.md
          cat performance.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post it on the pull request
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: performance
          path: performance.md
      - name: Let the reading decide whether a regression fails this
        run: |
          steady="$(grep -oE '[0-9]+(\.[0-9]+)?%' "$RUNNER_TEMP/stability.md" | tr -d '%' | sort -rn | head -n 1)"
          regressed="$(jq '[.significant // [] | .[] | select(.current.meanDuration > .baseline.meanDuration or .current.meanCount > .baseline.meanCount)] | length' apps/native/.reassure/output.json 2>/dev/null || echo unknown)"
          echo "Widest random change on this runner: ${steady:-none read} per cent. Significant changes: $regressed."
          if [ -z "$steady" ]; then
            echo "::error::The stability run left no reading, so nothing decides whether this gates."
            exit 1
          fi
          if [ "$regressed" = unknown ]; then
            if [ -f "$RUNNER_TEMP/no-base-measurement" ]; then
              echo "::notice::The merge base has no screen to measure, so this job reported only."
              exit 0
            fi
            echo "::error::The comparison left no answer although the merge base could be measured."
            exit 1
          fi
          if awk -v reading="$steady" 'BEGIN { exit !(reading < 5) }'; then
            if [ "$regressed" -gt 0 ]; then
              echo "::error::The runner is steady at $steady per cent, under the 5 per cent Reassure calls steady, and $regressed scenario(s) changed significantly. The comment on the pull request names them."
              exit 1
            fi
            echo "The runner is steady at $steady per cent and nothing changed significantly."
          else
            echo "::warning::The runner read $steady per cent, at or above the 5 per cent Reassure calls steady, so this job reported rather than gated."
          fi

  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Export the scripts the app ships for both phones and the web, so they are weighed
        run: pnpm --filter @seatscout/native run weigh
      - name: Install the counter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloc" https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl
          echo "bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  $RUNNER_TEMP/cloc" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/cloc" /usr/local/bin/cloc
      - name: Measure the footprint
        run: pnpm footprint --base "$BASE" --head "$HEAD" --out footprint.md
      - name: Hand the measurement to the job that reports every gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: footprint
          path: footprint.md
          if-no-files-found: ignore

  footprint:
    needs: [changes, quality, mutation, android, performance, measure, secrets, dependencies]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Collect what the change weighs
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: footprint
      - name: Say what every gate did
        run: |
          {
            echo "## What the gates did"
            echo
            echo "| gate | verdict |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
            echo
            echo "A skipped mutation job means this change touches no source file; a skipped android or performance job means it touches nothing the app is built from."
            echo
            cat footprint.md 2>/dev/null || echo "The footprint was not measured on this run, so there are no figures below."
          } > report.md
          mv report.md footprint.md
          cat footprint.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the report on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: footprint
          path: footprint.md
      - name: Refuse the change if any gate failed or did not finish
        run: |
          refused="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' <<< "$RESULTS")"
          if [ -n "$refused" ]; then
            echo "::error::These gates did not pass: $(echo "$refused" | tr '\n' ' ')"
            exit 1
          fi
          skipped="$(jq -r '[.changes.result, .quality.result, .measure.result, .secrets.result, .dependencies.result] | map(select(. != "success")) | length' <<< "$RESULTS")"
          if [ "$skipped" != 0 ]; then
            echo "::error::A gate that runs on every change was skipped."
            exit 1
          fi

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALLOWED: 0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-4.0,CC-BY-SA-4.0,CC0-1.0,ISC,LGPL-3.0-or-later,MIT,MIT-0,MPL-2.0,Python-2.0,Unlicense
      PLANTED: tools/planted-red/planted/licences/planted-licence.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
      - name: Hold every dependency's licence to the allowlist
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --licenses=${{ env.ALLOWED }}
            --recursive
            ./
      - name: Read the same allowlist over a planted undetermined licence
        id: planted
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=${{ env.PLANTED }}
            --licenses=${{ env.ALLOWED }}
            --recursive
            ./
      - name: Refuse an allowlist that took the planted licence
        if: steps.planted.outcome == 'success'
        run: |
          echo "The allowlist accepted UNKNOWN, so it gates no licence at all." >&2
          exit 1
