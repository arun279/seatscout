name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - name: Install actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
      - name: Install shellcheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm complexity
      - run: actionlint
      - run: shellcheck deploy/*.sh
      - run: pnpm spell
      - run: pnpm typecheck
      - run: pnpm dead-code
      - run: pnpm live-injections
      - run: pnpm cache-storage
      - run: pnpm counts
      - run: pnpm claims
      - run: pnpm test:unit
      - run: pnpm build
      - name: Check the deployment builds from the repository alone
        working-directory: apps/proxy
        run: pnpm exec wrangler deploy --dry-run
      - name: Install the browser the end-to-end suite drives
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Measure the journey on this branch
        run: pnpm test:journey
      - name: Measure the journey at the merge base
        run: |
          git worktree add "$RUNNER_TEMP/base" "$(git merge-base "$BASE" HEAD)"
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          if listed="$(pnpm exec playwright test --list --grep @performance 2>&1)"; then
            pnpm build
            pnpm exec playwright test --grep @performance
            cp reports/journey/samples.json "$GITHUB_WORKSPACE/reports/journey/base.json"
          elif printf '%s' "$listed" | grep -q "No tests found"; then
            echo "The merge base has no journey to hold this one to."
          else
            printf '%s\n' "$listed"
            exit 1
          fi
      - name: Hold the journey to the merge base
        run: |
          if [ -f reports/journey/base.json ]; then
            pnpm journey --head reports/journey/samples.json --base reports/journey/base.json
          else
            pnpm journey --head reports/journey/samples.json --no-baseline
          fi

  footprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Restore what an earlier run already judged
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.head_ref }}-
            stryker-main-
      - name: Judge the suite by mutating the code it tests
        continue-on-error: true
        run: pnpm test:mutation:incremental
      - name: Install the counter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloc" https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl
          echo "bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  $RUNNER_TEMP/cloc" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/cloc" /usr/local/bin/cloc
      - name: Measure the footprint
        run: pnpm footprint --base "$BASE" --head "$HEAD" --out footprint.md
      - name: Check the report reproduces
        if: ${{ !cancelled() }}
        run: |
          pnpm footprint --base "$BASE" --head "$HEAD" --out footprint-again.md || true
          cmp footprint.md footprint-again.md
      - name: Add the report to the run summary
        if: ${{ !cancelled() }}
        run: cat footprint.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the report on the pull request
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: footprint
          path: footprint.md

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.20.0
          install: false
      - name: Scan dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
