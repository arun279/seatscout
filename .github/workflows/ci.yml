name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: apps/native packages package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json .github/workflows/ci.yml
  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.app.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Say whether this change touches the app
        id: app
        run: |
          # shellcheck disable=SC2086
          if git diff --quiet HEAD^1 HEAD -- $APP; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.20.0
          cache: true
          save-cache: false
          install: false
      - name: Install actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
      - name: Install shellcheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - name: Install lychee
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" lychee-x86_64-unknown-linux-gnu/lychee
          sudo install -m 0755 "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" /usr/local/bin/lychee
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm complexity
      - run: pnpm duplication
      - run: actionlint
      - run: shellcheck apps/native/e2e/*.sh
      - run: pnpm spell
      - run: pnpm markdown
      - run: pnpm links
      - name: Watch the link check refuse a missing file and a missing heading, and pass the planted record whose links resolve
        run: |
          mkdir "$RUNNER_TEMP/links"
          cp tools/planted-red/planted/links/broken.md.txt "$RUNNER_TEMP/links/broken.md"
          cp tools/planted-red/planted/links/whole.md.txt "$RUNNER_TEMP/links/whole.md"
          lychee --offline --include-fragments --no-progress "$RUNNER_TEMP/links/whole.md"
          if lychee --offline --include-fragments --no-progress "$RUNNER_TEMP/links/broken.md" > "$RUNNER_TEMP/links/said.txt" 2>&1; then
            echo "::error::lychee passed a record that links to a missing file and a missing heading."
            exit 1
          fi
          grep -q "no-such-record.md" "$RUNNER_TEMP/links/said.txt"
          grep -q "a-section-that-is-not-here" "$RUNNER_TEMP/links/said.txt"
      - run: pnpm typecheck
      - run: pnpm dead-code
      - run: pnpm versions
      - run: pnpm --filter @seatscout/native run install-check
      - run: pnpm --filter @seatscout/native run doctor
      - run: pnpm counts
      - run: pnpm claims
      - run: pnpm test:unit
      - run: pnpm build

  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.20.0
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:native

  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.20.0
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Check the app bundles for both phones and the web build the accessibility scan reads, on a machine that has only what the lockfile installs
        run: pnpm --filter @seatscout/native run bundle
      - name: Install the browser the accessibility scan drives
        run: pnpm exec playwright install --with-deps chromium
      - name: Scan every screen of the app's web build with axe
        run: pnpm test:e2e
      - name: Check the same source exports the same scripts twice, so the size gate weighs the change and not the build
        working-directory: apps/native
        run: |
          pnpm run weigh
          mv dist "$RUNNER_TEMP/first"
          pnpm run weigh
          diff -r "$RUNNER_TEMP/first/_expo/static/js" dist/_expo/static/js
          rm -rf "$RUNNER_TEMP/first"

  android:
    needs: changes
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SEATSCOUT_UPSTREAM: corpus
      APP_ID: io.github.arun279.seatscout
      LINK: seatscout:///?area=75006&date=2026-09-20&partySize=2
      OUT: reports/device
      APK: apps/native/android/app/build/outputs/apk/release/app-release.apk
      WALK: apps/native/e2e/journey.yaml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.20.0
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Write the Android project the app's configuration describes
        run: pnpm --filter @seatscout/native exec expo prebuild --platform android --no-install
      - name: Read Gradle's caches as main's Baseline run left them
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Build the release app for the emulator's processor, with the Source answered from the corpus
        working-directory: apps/native/android
        env:
          NDK_VERSION: 27.3.13750724
          CMAKE_VERSION: 3.31.5
        run: |
          find "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" -mindepth 1 -maxdepth 1 | sort > "$RUNNER_TEMP/shipped"
          ./gradlew assembleRelease --init-script ../../../.github/gradle/preinstalled-android-tools.gradle -PreactNativeArchitectures=x86_64 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          if ! find "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" -mindepth 1 -maxdepth 1 | sort | diff "$RUNNER_TEMP/shipped" -; then
            echo "::error::Gradle downloaded an NDK or a CMake, so a build can fail on a corrupt download. Every Android project should build with NDK $NDK_VERSION and CMake $CMAKE_VERSION, which the runner image ships."
            exit 1
          fi
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Let the emulator use the runner's hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$OUT"
      - name: Walk the journey on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: apps/native/e2e/device.sh
      - name: Keep what Maestro wrote of the walk
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device
          path: |
            ${{ env.OUT }}/journey.xml
            ${{ env.OUT }}/maestro/
          if-no-files-found: ignore
          include-hidden-files: true

  performance:
    needs: changes
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      TEST_RUNNER_ARGS: --config jest.perf.config.js --ci --maxWorkers 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.20.0
          cache: true
          save-cache: false
          install: false
      - name: Measure the same code twice, for the comment
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          { pnpm reassure --baseline && pnpm reassure; } | tee "$RUNNER_TEMP/stability.md"
          rm -rf apps/native/.reassure
      - name: Measure the screens on main as the change merges into it
        run: |
          merged="$(git rev-parse HEAD)"
          git switch --detach HEAD^1
          pnpm install --frozen-lockfile
          if [ -f apps/native/jest.perf.config.js ]; then
            pnpm reassure --baseline
          else
            echo "Main has no screen to measure."
            touch "$RUNNER_TEMP/no-base-measurement"
          fi
          git switch --detach "$merged"
          pnpm install --frozen-lockfile
      - name: Measure them on this branch and compare
        run: pnpm reassure
      - name: Say what it measured
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Render performance"
            echo
            echo "### How steady the runner is"
            echo
            echo "The same code measured twice, for information. The gate does not depend on it:"
            echo "every run holds a slower scenario to the drift unchanged code shows."
            echo
            echo '```'
            cat "$RUNNER_TEMP/stability.md"
            echo '```'
            echo
            echo "### This change against main as it merges into it"
            echo
            cat apps/native/.reassure/output.md 2>/dev/null || echo "Nothing was measured."
          } > performance.md
          cat performance.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post it on the pull request
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: performance
          path: performance.md
      - name: Fail on a scenario that renders slower than unchanged code drifts, or more often
        env:
          SLOWDOWN_FLOOR: "0.063"
        run: |
          regressed="$(jq --argjson floor "$SLOWDOWN_FLOOR" '[.significant // [] | .[] | select(.relativeDurationDiff >= $floor or .current.meanCount > .baseline.meanCount)] | length' apps/native/.reassure/output.json 2>/dev/null || echo unknown)"
          if [ "$regressed" = unknown ]; then
            if [ -f "$RUNNER_TEMP/no-base-measurement" ]; then
              echo "::notice::Main has no screen to measure, so this job reported only."
              exit 0
            fi
            echo "::error::The comparison left no answer although main could be measured."
            exit 1
          fi
          if [ "$regressed" -gt 0 ]; then
            echo "::error::$regressed scenario(s) rendered significantly slower, by $SLOWDOWN_FLOOR or more, which unchanged code does not drift to, or rendered more often. The comment on the pull request names them."
            exit 1
          fi
          echo "No scenario rendered slower by $SLOWDOWN_FLOOR or more, or more often."

  measure:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.20.0
          cache: true
          save-cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Export the scripts the app ships for both phones, so they are weighed
        run: pnpm --filter @seatscout/native run weigh
      - name: Check out main as this change merges into it, to be weighed by this change's globs
        id: main_checkout
        continue-on-error: true
        run: |
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "::error::The checkout is not this change merged into main, so there is no main side to weigh."
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/main" HEAD^1
          cp .size-limit.json "$RUNNER_TEMP/main/.size-limit.json"
      - name: Export main's scripts for both phones the same way
        id: main_export
        if: steps.main_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/main
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @seatscout/native run weigh
      - name: Install the counter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloc" https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl
          echo "bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  $RUNNER_TEMP/cloc" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/cloc" /usr/local/bin/cloc
      - name: Measure the footprint, accepting a bigger bundle only under the bundle-grows label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MAIN_EXPORT: ${{ steps.main_export.outcome }}
        run: |
          flags=()
          labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')"
          if grep -qx bundle-grows <<< "$labels"; then
            flags+=(--bundle-grows)
          fi
          if [ "$MAIN_EXPORT" != success ]; then
            flags+=(--main-unexported)
          fi
          pnpm footprint --base "$BASE" --head "$HEAD" --main-tree "$RUNNER_TEMP/main" "${flags[@]}" --out footprint.md
      - name: Hand the measurement to the job that reports every gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprint
          path: footprint.md
          if-no-files-found: ignore

  footprint:
    needs: [changes, quality, native-tests, bundle, performance, measure, secrets, dependencies]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Refuse a rerun that main has moved past, since a rerun keeps its first merge with main
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          main="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          if [ "$main" != "$BASE" ]; then
            echo "::error::main moved since this run started; push or rebase to get a fresh run before merging."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.20.0
          cache: false
          install: false
      - name: Time the jobs this job waits on, against the ten-minute guideline for the build that gates a change
        id: timed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          verdict=0
          node tools/gating-time/src/index.ts --workflow .github/workflows/ci.yml --run "$GITHUB_RUN_ID" --job "$GITHUB_JOB" > gating-time.md || verdict=$?
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
      - name: Collect what the change weighs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: footprint
      - name: Say what every gate did
        run: |
          {
            echo "## What the gates did"
            echo
            echo "| gate | verdict |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
            echo
            echo "A skipped performance job means this change touches nothing the app is built from. The walk on the emulator, \`android\`, is a later stage: this job does not wait for it, and its own check on the pull request shows its result."
            echo
            cat gating-time.md
            echo
            cat footprint.md 2>/dev/null || echo "The footprint was not measured on this run, so there are no figures below."
          } > report.md
          mv report.md footprint.md
          cat footprint.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the report on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: footprint
          path: footprint.md
      - name: Refuse the change if any gate failed or did not finish, or the gates took longer than ten minutes
        env:
          TIMED: ${{ steps.timed.outputs.verdict }}
        run: |
          refused="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' <<< "$RESULTS")"
          if [ -n "$refused" ]; then
            echo "::error::These gates did not pass: $(echo "$refused" | tr '\n' ' ')"
            exit 1
          fi
          skipped="$(jq -r '[.changes.result, .quality.result, ."native-tests".result, .bundle.result, .secrets.result, .dependencies.result] | map(select(. != "success")) | length' <<< "$RESULTS")"
          if [ "$skipped" != 0 ]; then
            echo "::error::A gate that runs on every change was skipped."
            exit 1
          fi
          if [ "$TIMED" != 0 ]; then
            echo "::error::The jobs that gate this change took longer than ten minutes, or could not be timed. The Gating time section of the report says which."
            exit 1
          fi

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -x -f "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Scan the pushed commits for secrets
        run: gitleaks git --no-banner --redact --verbose --log-opts="$BASE..$HEAD" .

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALLOWED: 0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-4.0,CC-BY-SA-4.0,CC0-1.0,ISC,LGPL-3.0-or-later,MIT,MIT-0,MPL-2.0,PSF-2.0,Python-2.0,Unlicense
      PLANTED: tools/planted-red/planted/licences/planted-licence.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
      - name: Hold every dependency's licence to the allowlist
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --licenses=${{ env.ALLOWED }}
            --recursive
            ./
      - name: Read the same allowlist over a planted undetermined licence
        id: planted
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=${{ env.PLANTED }}
            --licenses=${{ env.ALLOWED }}
            --recursive
            ./
      - name: Refuse an allowlist that took the planted licence
        if: steps.planted.outcome == 'success'
        run: |
