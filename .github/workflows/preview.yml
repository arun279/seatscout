name: Preview

on:
  push:
    branches:
      - main
    paths:
      - apps/native/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/preview.yml

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

env:
  CHANNEL: preview
  EAS_CLI: eas-cli@24.7.0

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.20.0
          cache: true
          save-cache: false
          install: false
      - name: Install what the bundle is built from
        run: pnpm install --frozen-lockfile
      - name: Name the account the token answers for
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::This repository holds no EXPO_TOKEN, so the phones cannot be sent the app. docs/adr/0021-a-merge-publishes-a-preview-not-a-release.md says what it has to be."
            exit 1
          fi
          if ! npx --yes "$EAS_CLI" whoami; then
            echo "::error::EXPO_TOKEN was refused. It has to be a live token for a user with the developer role on the account apps/native/app.json names as the owner."
            exit 1
          fi
      - name: Publish the update both phones follow
        working-directory: apps/native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes "$EAS_CLI" update --channel "$CHANNEL" --environment preview \
            --message "$(git log -1 --pretty=%s)" --json > "$RUNNER_TEMP/update.json"
      - name: Start a build for any phone whose installed build cannot run this update
        working-directory: apps/native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          owner="$(jq -er .expo.owner app.json)"
          slug="$(jq -er .expo.slug app.json)"
          while read -r platform runtime; do
            usable="$(npx --yes "$EAS_CLI" build:list --platform "$platform" \
              --channel "$CHANNEL" --runtime-version "$runtime" --json --non-interactive \
              | jq '[.[] | select(.status != "ERRORED" and .status != "CANCELED")] | length')"
            if [ "$usable" -gt 0 ]; then
              echo "- $platform: runtime \`$runtime\` already has a build." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            id="$(npx --yes "$EAS_CLI" build --platform "$platform" --profile preview \
              --no-wait --json --non-interactive | jq -er '.[0].id')"
            link="https://expo.dev/accounts/$owner/projects/$slug/builds/$id"
            echo "- $platform: $link" | tee -a "$RUNNER_TEMP/builds.md" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -er '.[] | "\(.platform | ascii_downcase) \(.runtimeVersion)"' "$RUNNER_TEMP/update.json" | sort -u)
      - name: Say where to install the new builds, since the installed ones stop getting updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/builds.md" ] || exit 0
          {
            echo "A merge changed the app's native side, so the installed builds below no longer receive updates. Install these once Expo finishes them, then close this issue."
            echo
            cat "$RUNNER_TEMP/builds.md"
          } > install.md
          gh label create install --color 0E8A16 --force \
            --description "A merge needs new builds installed on the phones"
          open=$(gh issue list --label install --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file install.md
          else
            gh issue create --label install --body-file install.md \
              --title "New builds to install on the phones"
          fi
