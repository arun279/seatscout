name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Look for the hosting credentials
        id: look
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "This repository holds no hosting credentials, so nothing was deployed. \`deploy/README.md\` says how to set them up." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID together or not at all. See deploy/README.md." >&2
            exit 1
          fi
      - name: Check out repository
        if: steps.look.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        if: steps.look.outputs.present == 'true'
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.20.0
          cache: true
          install: false
      - name: Install what the build needs
        if: steps.look.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build what the deployment publishes
        if: steps.look.outputs.present == 'true'
        run: pnpm build
      - name: Deploy the worker and the assets it serves
        if: steps.look.outputs.present == 'true'
        working-directory: apps/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
