version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      all-updates:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    rebase-strategy: disabled
    ignore:
      # The Expo SDK pins these; `expo install --fix` moves them together at an SDK upgrade.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-community/*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: expo
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: jest-expo
      - dependency-name: babel-preset-expo
      - dependency-name: jest
      - dependency-name: '@jest/globals'
      - dependency-name: '@types/react'
      # Stryker's Vitest runner runs no tests per mutant on Vitest 5 (stryker-js#6210); lift when a fixed release ships.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
    groups:
      non-major-updates:
        update-types:
          - minor
          - patch
