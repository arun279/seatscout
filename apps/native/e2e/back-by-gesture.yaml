appId: ${APP_ID}
name: Back by the platform's gesture, from a sheet, a dialog or a pushed screen
---
- runFlow:
    when:
      true: ${LEVEL == 'sheet'}
    commands:
      - swipe:
          start: 50%, 55%
          end: 50%, 98%
- runFlow:
    when:
      platform: iOS
      true: ${LEVEL == 'dialog'}
    commands:
      - swipe:
          start: 50%, 15%
          end: 50%, 95%
- runFlow:
    when:
      platform: Android
      true: ${LEVEL == 'dialog' || LEVEL == 'pushed'}
    commands:
      - back
- runFlow:
    when:
      platform: iOS
      true: ${LEVEL == 'pushed'}
    commands:
      - swipe:
          start: 1%, 50%
          end: 75%, 50%
